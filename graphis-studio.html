<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Éditeur RAW Web - Graphis Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Allura&family=Caveat:wght@400..700&family=Dancing+Script:wght@400..700&family=Great+Vibes&family=Pacifico&family=Pinyon+Script&family=Sacramento&family=Satisfy&display=swap" rel="stylesheet">

<style>
    :root {
        --bg-color: #121212;
        --panel-bg: rgba(25, 25, 25, 0.95);
        --accent-color: #FFD700;
        --text-color: #E0E0E0;
        --border-color: #333;
    }

    * {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    *::selection {
        background: transparent;
        color: inherit;
    }

    body { margin: 0; background-color: var(--bg-color); color: var(--text-color); font-family: -apple-system, sans-serif; overflow: hidden; }

    header { padding: 12px 20px; background: #1a1a1a; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
    
    .brand-logo {
        font-weight: 800;
        font-size: 16px;
        letter-spacing: 1.5px;
        color: var(--accent-color);
        text-transform: uppercase;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .brand-logo span { color: #fff; font-weight: 300; }

    .header-center { display: flex; align-items: center; }

    button { background: transparent; color: var(--accent-color); border: 1px solid var(--accent-color); padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; transition: all 0.2s; }
    button:hover { background: var(--accent-color); color: var(--bg-color); }

    #workspace { display: flex; flex-direction: column; justify-content: center; align-items: center; height: calc(100vh - 57px); position: relative; overflow: hidden; }
    
    #zoom-toolbar {
        position: absolute;
        top: 15px;
        background: rgba(20, 20, 20, 0.85);
        border: 1px solid var(--border-color);
        padding: 6px 12px;
        border-radius: 6px;
        display: flex;
        gap: 8px;
        z-index: 8;
        backdrop-filter: blur(5px);
    }
    #zoom-toolbar button { padding: 4px 10px; font-size: 12px; }

    #image-container { 
        position: relative; 
        width: 100%; 
        height: 100%; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        overflow: hidden;
        perspective: 1000px;
        background-color: var(--bg-color);
    }
    
    .canvas-layer { 
        position: absolute;
        display: block; 
        max-width: 80%; 
        max-height: 80%; 
        object-fit: contain; 
        cursor: grab;
        transform-origin: center center; 
        background: transparent !important;
    }
    .canvas-layer:active { cursor: grabbing; }

    body.tool-brush .canvas-layer,
    body.tool-brush #image-container {
        cursor: none !important;
    }

    #brush-cursor {
        position: absolute;
        pointer-events: none;
        display: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        border-radius: 50%;
    }
    .brush-outer-circle {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 50%;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.8), inset 0 0 2px rgba(0, 0, 0, 0.8);
    }
    .brush-inner-circle {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        border: 1px dashed rgba(255, 215, 0, 0.9);
        border-radius: 50%;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.6);
    }

    #transform-bounding-box {
        position: absolute;
        display: none;
        border: 1px dashed var(--accent-color);
        background: transparent !important;
        background-color: transparent !important;
        pointer-events: none;
        z-index: 1000;
        box-sizing: border-box;
        filter: none !important;
        box-shadow: none !important;
        outline: none !important;
    }
    .t-handle {
        position: absolute;
        width: 10px;
        height: 10px;
        background: #fff;
        border: 1px solid var(--accent-color);
        pointer-events: auto;
    }
    #h_tl { top: -5px; left: -5px; cursor: nwse-resize; }
    #h_tr { top: -5px; right: -5px; cursor: nesw-resize; }
    #h_bl { bottom: -5px; left: -5px; cursor: nesw-resize; }
    #h_br { bottom: -5px; right: -5px; cursor: nwse-resize; }
    #h_rot { top: -25px; left: 50%; transform: translateX(-50%); width: 12px; height: 12px; border-radius: 50%; background: var(--accent-color); cursor: grab; }
    
    #vignette-overlay { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 999; transition: none; }

    #layersPanel {
        display: none;
        position: absolute;
        top: 70px;
        left: 20px;
        width: 350px;
        max-height: 80vh;
        overflow-y: auto;
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.9);
        backdrop-filter: blur(10px);
        z-index: 12;
    }

    .layer-item {
        background: #222;
        padding: 6px 10px;
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
        cursor: grab;
        border: 1px solid #444;
        font-size: 12px;
        gap: 8px;
        transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .layer-item.active { border-color: var(--accent-color); background: #2a2a2a; }
    .layer-item.dragging { opacity: 0.4; border-style: dashed; }
    .layer-item.drag-over { border-top: 2px solid var(--accent-color); }
    
    .layer-info { 
        display: flex; 
        align-items: center; 
        gap: 6px; 
        flex: 1; 
        min-width: 0; 
    }
    .layer-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        min-width: 0;
    }

    .smart-badge {
        font-size: 9px;
        color: var(--accent-color);
        border: 1px solid var(--accent-color);
        border-radius: 2px;
        padding: 1px 3px;
        margin-left: 4px;
        flex-shrink: 0;
    }
    
    .layer-thumbnail, .layer-mask-thumbnail {
        width: 28px;
        height: 28px;
        object-fit: cover;
        border-radius: 3px;
        border: 1px solid #555;
        background-color: #1a1a1a;
        flex-shrink: 0;
    }
    .layer-mask-thumbnail {
        border-color: #fff;
        background: #fff;
    }

    #thumbnail-preview-popover {
        position: fixed;
        display: none;
        width: 180px;
        height: 180px;
        object-fit: contain;
        background-color: #181818;
        border: 2px solid var(--accent-color);
        border-radius: 6px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.85);
        z-index: 9999;
        pointer-events: none;
    }

    .icon-btn {
        background: transparent;
        border: 1px solid var(--accent-color);
        border-radius: 4px;
        padding: 3px 5px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        flex-shrink: 0;
    }
    .icon-btn svg {
        width: 12px;
        height: 12px;
        stroke: var(--accent-color);
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
    .icon-btn:hover { background: var(--accent-color); }
    .icon-btn:hover svg { stroke: var(--bg-color); }

    .layer-actions { display: flex; gap: 4px; flex-shrink: 0; }

    .tool-select-box {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        margin-bottom: 12px;
        background: #1a1a1a;
        padding: 4px;
        border-radius: 4px;
        border: 1px solid #333;
    }
    .tool-btn {
        background: transparent;
        color: #aaa;
        border: none;
        padding: 6px 2px;
        font-size: 10px;
        border-radius: 3px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
    }
    .tool-btn.active {
        background: var(--accent-color);
        color: #121212;
        font-weight: bold;
    }
    .tool-btn.active svg { stroke: #121212; }

    .mask-brush-box, .text-options-box {
        display: none;
        background: rgba(255, 215, 0, 0.08);
        border: 1px solid var(--accent-color);
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 12px;
    }
    .mask-brush-box h4, .text-options-box h4 { margin: 0 0 8px 0; font-size: 11px; color: var(--accent-color); text-transform: uppercase; }

    .layer-settings-box {
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid #333;
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 12px;
    }

    .transform-box {
        margin-top: 15px;
        border-top: 1px solid #333;
        padding-top: 10px;
    }
    .transform-box h4, .layer-settings-box h4 { margin: 0 0 8px 0; font-size: 11px; color: var(--accent-color); text-transform: uppercase; }
    .transform-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 8px; }
    .transform-grid button { padding: 6px; display: flex; align-items: center; justify-content: center; }

    .transform-input-wrapper { display: flex; align-items: center; gap: 6px; }
    .reset-btn {
        background: transparent;
        border: none;
        color: #888;
        cursor: pointer;
        padding: 2px 4px;
        border-radius: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .reset-btn:hover { color: var(--accent-color); }
    .reset-btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }

    .number-input {
        width: 50px !important;
        text-align: right;
        padding: 2px 4px !important;
        font-size: 11px !important;
        background: #1e1e1e !important;
        border: 1px solid #444 !important;
        border-radius: 3px !important;
        color: var(--accent-color) !important;
    }

    #panel { position: absolute; top: 20px; right: 20px; width: 340px; max-height: 90vh; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 10; }
    .panel-header { padding: 15px; border-bottom: 1px solid var(--border-color); cursor: move; display: flex; justify-content: space-between; align-items: center; }
    .panel-header h2 { margin: 0; font-size: 14px; color: var(--accent-color); text-transform: uppercase; letter-spacing: 1px; }

    .local-tools { display: flex; justify-content: space-around; padding: 10px; border-bottom: 1px solid var(--border-color); background: rgba(0,0,0,0.2); }
    .panel-content { overflow-y: auto; padding: 10px; flex-grow: 1; }

    details { margin-bottom: 5px; border-bottom: 1px solid #2a2a2a; }
    summary { padding: 10px 5px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-color); display: flex; justify-content: space-between; list-style: none; }
    summary:after { content: "▼"; font-size: 10px; color: #666; }
    details[open] summary:after { content: "▲"; color: var(--accent-color); }

    .module-content { padding: 10px 5px 15px 5px; }
    .control-group { margin-bottom: 12px; }
    .control-group label { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 11px; color: #bbb; align-items: center; }
    
    input[type=range] { width: 100%; accent-color: var(--accent-color); height: 4px; background: #333; outline: none; -webkit-appearance: none; border-radius: 2px; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent-color); cursor: pointer; }
    select, input[type=text] { width: 100%; background: #222; color: #fff; border: 1px solid #444; padding: 4px; border-radius: 4px; font-size: 11px; box-sizing: border-box; }
    input[type=color] { width: 40px; height: 22px; background: #222; color: #fff; border: 1px solid #444; padding: 1px; border-radius: 4px; cursor: pointer; }
    hr.divider { border-color: #333; margin: 15px 0; border-style: solid; border-width: 1px 0 0 0; }
</style>
</head>
<body>

    <header>
        <div class="brand-logo">Graphis<span>Studio</span></div>
        <div class="header-center">
            <input type="file" id="fileInput" accept="image/*, .cr2, .cr3, .nef, .arw, .dng, .raw, .orf, .rw2" style="display: none;">
            <input type="file" id="layerFileInput" accept="image/*, .cr2, .cr3, .nef, .arw, .dng, .raw, .orf, .rw2" style="display: none;">
            <button id="importBtn">Importer</button>
            <button id="layersBtn" style="margin-left: 10px;">Système de Calques</button>
        </div>
        <button id="exportBtn">Exporter</button>
    </header>

    <div id="workspace">
        <div id="brush-cursor"><div class="brush-outer-circle"></div><div class="brush-inner-circle"></div></div>
        <img id="thumbnail-preview-popover" alt="Agrandissement calque">

        <div id="layersPanel">
            <h3 style="margin-top:0; color:var(--accent-color); font-size:13px; text-transform:uppercase; border-bottom:1px solid #333; padding-bottom:8px;">Calques (Objets Dynamiques)</h3>
            
            <div class="tool-select-box">
                <button class="tool-btn active" id="toolMove"><span>Déplac.</span></button>
                <button class="tool-btn" id="toolFreeTransform"><span>Transf.</span></button>
                <button class="tool-btn" id="toolMaskBrush"><span>Masque</span></button>
                <button class="tool-btn" id="toolText"><span>Texte</span></button>
            </div>

            <div class="mask-brush-box" id="maskBrushBox">
                <h4>Option du Pinceau de Masque</h4>
                <div class="control-group">
                    <label>Couleur <select id="brushColorSelect"><option value="black">Noir (Masquer)</option><option value="white">Blanc (Révéler)</option></select></label>
                </div>
                <div class="control-group"><label>Taille <span class="value-display" id="val_brushSize">30px</span></label><input type="range" id="brushSize" min="5" max="150" value="30"></div>
                <div class="control-group"><label>Opacité <span class="value-display" id="val_brushOpacity">100%</span></label><input type="range" id="brushOpacity" min="1" max="100" value="100"></div>
            </div>

            <div class="text-options-box" id="textOptionsBox">
                <h4 id="textPanelTitle">Propriétés du Texte / Signature</h4>
                <div class="control-group"><label>Texte <input type="text" id="textInputVal" value="Graphis Studio"></label></div>
                <div class="control-group">
                    <label>Police
                        <select id="textFontSelect">
                            <option value="Dancing Script">Dancing Script</option>
                            <option value="Great Vibes">Great Vibes</option>
                            <option value="Pacifico">Pacifico</option>
                        </select>
                    </label>
                </div>
                <div class="control-group"><label>Couleur <input type="color" id="textColorPicker" value="#FFD700"></label></div>
                <input type="file" id="logoFileInput" accept="image/png, image/jpeg, image/webp" style="display: none;">
                <button id="importLogoBtn" style="width:100%; margin-bottom:10px;">Charger un Logo PNG</button>
            </div>

            <div class="layer-settings-box">
                <h4>Style du Calque Actif</h4>
                <div class="control-group">
                    <label>Mode de Fusion 
                        <select id="layerBlendMode">
                            <option value="normal">Normal</option>
                            <option value="screen">Superposition</option>
                            <option value="multiply">Produit</option>
                        </select>
                    </label>
                </div>
                <div class="control-group"><label>Opacité <span class="value-display" id="val_opacity">100%</span></label><input type="range" id="layerOpacity" min="0" max="100" value="100"></div>
            </div>

            <div id="layersContainer"></div>
            <button id="addLayerBtn" style="width: 100%; margin-top: 10px;">+ Nouveau Calque Image</button>

            <div class="transform-box">
                <h4>Géométrie & Transformation</h4>
                <div class="control-group">
                    <label>Échelle 
                        <div class="transform-input-wrapper">
                            <button class="reset-btn" onclick="resetTransformField('tr_scale', 100)"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg></button>
                            <input type="number" id="num_scale" class="number-input" value="100" min="10" max="300"> %
                        </div>
                    </label>
                    <input type="range" id="tr_scale" min="10" max="300" value="100">
                </div>
                <div class="control-group">
                    <label>Rotation 
                        <div class="transform-input-wrapper">
                            <button class="reset-btn" onclick="resetTransformField('tr_rot', 0)"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg></button>
                            <input type="number" id="num_rot" class="number-input" value="0" min="-180" max="180"> °
                        </div>
                    </label>
                    <input type="range" id="tr_rot" min="-180" max="180" value="0">
                </div>
            </div>
        </div>

        <div id="zoom-toolbar">
            <button id="zoomOutBtn">-</button><button id="fitScreenBtn">Ajuster</button><button id="zoom100Btn">100%</button><button id="zoomInBtn">+</button>
        </div>

        <div id="image-container">
            <div id="transform-bounding-box">
                <div class="t-handle" id="h_tl"></div><div class="t-handle" id="h_tr"></div><div class="t-handle" id="h_bl"></div><div class="t-handle" id="h_br"></div><div class="t-handle" id="h_rot"></div>
            </div>
            <div id="vignette-overlay"></div>
        </div>
        
        <div id="panel">
            <div class="panel-header" id="panelHeader">
                <h2>Caméra RAW (Filtres Dynamiques)</h2>
                <button id="resetLayerFiltersBtn" style="font-size:10px; padding:2px 6px;" title="Réinitialiser les filtres du calque actif">Réinitialiser</button>
            </div>

            <div class="panel-content" id="controls">
                <details open><summary>Réglages de base</summary>
                    <div class="module-content">
                        <div class="control-group"><label>Température <span class="value-display">0</span></label><input type="range" id="t_temp" min="-100" max="100" value="0"></div>
                        <div class="control-group"><label>Teinte <span class="value-display">0</span></label><input type="range" id="t_tint" min="-100" max="100" value="0"></div>
                        <div class="control-group"><label>Exposition <span class="value-display">0.0</span></label><input type="range" id="t_exp" min="-5" max="5" step="0.1" value="0"></div>
                        <div class="control-group"><label>Contraste <span class="value-display">0</span></label><input type="range" id="t_cont" min="-100" max="100" value="0"></div>
                        <div class="control-group"><label>Saturation <span class="value-display">0</span></label><input type="range" id="t_sat" min="-100" max="100" value="0"></div>
                    </div>
                </details>
            </div>
        </div>
    </div>

    <script>
        const layersContainer = document.getElementById('layersContainer');
        const imageContainer = document.getElementById('image-container');
        let layers = [], activeLayerId = null, selectedLayerIds = [];

        // STRUCTURE D'UN CALQUE DYNAMIQUE NATIVE (SMART OBJECT)
        function createLayer(imgSrc, name = "Calque", initialData = null) {
            const id = 'layer_' + Date.now();
            const canvasLayer = document.createElement('canvas');
            canvasLayer.className = 'canvas-layer';
            
            const rawImg = new Image();
            rawImg.crossOrigin = 'anonymous';

            const layerObj = {
                id, name, 
                img: canvasLayer,
                rawImg: rawImg, // IMAGE SOURCE CONSERVÉE EN LECTURE SEULE
                isSmartObject: true, // NATIVEMENT DYNAMIQUE
                x: initialData?.x ?? 0,
                y: initialData?.y ?? 0,
                scale: initialData?.scale ?? 1,
                rotation: initialData?.rotation ?? 0,
                opacity: initialData?.opacity ?? 100,
                blendMode: initialData?.blendMode ?? 'normal',
                visible: true,
                isText: !!initialData?.isText,
                isLogo: !!initialData?.isLogo,
                
                // PARAMÈTRES DE FILTRES DYNAMIQUE PROPRES À CE CALQUE
                settings: initialData?.settings ?? {
                    temp: 0, tint: 0, exp: 0, cont: 0, sat: 0
                }
            };

            rawImg.onload = () => {
                canvasLayer.width = rawImg.naturalWidth || 800;
                canvasLayer.height = rawImg.naturalHeight || 600;
                renderLayerComposite(layerObj);
                applyLayerTransform(layerObj);
                updateLayersUI();
            };
            rawImg.src = imgSrc;

            imageContainer.appendChild(canvasLayer);
            layers.push(layerObj);
            handleLayerSelection(id);
        }

        function handleLayerSelection(id) {
            activeLayerId = id;
            selectedLayerIds = [id];
            updateLayersUI();
            syncCameraRAWUI(); // CHARGE LES FILTRES DU CALQUE DANS L'INTERFACE
        }

        // SYNCHRONISE L'INTERFACE CAMÉRA RAW AVEC LES FILTRES DU CALQUE SÉLECTIONNÉ
        function syncCameraRAWUI() {
            const active = getActiveLayer();
            if (!active) return;

            const s = active.settings;
            document.getElementById('t_temp').value = s.temp;
            document.getElementById('t_tint').value = s.tint;
            document.getElementById('t_exp').value = s.exp;
            document.getElementById('t_cont').value = s.cont;
            document.getElementById('t_sat').value = s.sat;

            document.querySelectorAll('#controls .control-group').forEach(group => {
                const input = group.querySelector('input[type=range]');
                const display = group.querySelector('.value-display');
                if (input && display) display.innerText = input.value;
            });
        }

        // DÉTECTION DES MODIFICATIONS DES CURSEURS RAW POUR LE CALQUE ACTIF
        document.getElementById('controls').addEventListener('input', (e) => {
            const active = getActiveLayer();
            if (!active) return;

            if (e.target.id === 't_temp') active.settings.temp = parseFloat(e.target.value);
            if (e.target.id === 't_tint') active.settings.tint = parseFloat(e.target.value);
            if (e.target.id === 't_exp')  active.settings.exp  = parseFloat(e.target.value);
            if (e.target.id === 't_cont') active.settings.cont = parseFloat(e.target.value);
            if (e.target.id === 't_sat')  active.settings.sat  = parseFloat(e.target.value);

            processImage();
        });

        // RÉINITIALISATION DES FILTRES D'UN CALQUE
        document.getElementById('resetLayerFiltersBtn').addEventListener('click', () => {
            const active = getActiveLayer();
            if (!active) return;
            active.settings = { temp: 0, tint: 0, exp: 0, cont: 0, sat: 0 };
            syncCameraRAWUI();
            processImage();
        });

        // AFFICHE ET CALCULE VISUELLEMENT LES FILTRES SANS MODIFIER L'IMAGE ORIGINAL
        function processImage() {
            layers.forEach(layer => {
                const s = layer.settings;
                const brightness = 100 + (s.exp * 20);
                const contrast = 100 + s.cont;
                const saturate = 100 + s.sat;
                const hue = s.tint;

                // Application du filtre visuel en direct sur l'élément Canvas
                layer.img.style.filter = `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturate}%) hue-rotate(${hue}deg)`;
                applyLayerTransform(layer);
            });
        }

        function renderLayerComposite(layer) {
            const ctx = layer.img.getContext('2d');
            ctx.clearRect(0, 0, layer.img.width, layer.img.height);
            ctx.drawImage(layer.rawImg, 0, 0);
        }

        function applyLayerTransform(layer) {
            const transformStr = `translate(${layer.x}px, ${layer.y}px) scale(${layer.scale}) rotate(${layer.rotation}deg)`;
            layer.img.style.transform = transformStr;
            layer.img.style.opacity = layer.opacity / 100;
            layer.img.style.mixBlendMode = layer.blendMode;
        }

        function getActiveLayer() { return layers.find(l => l.id === activeLayerId); }

        function updateLayersUI() {
            layersContainer.innerHTML = '';
            layers.slice().reverse().forEach(layer => {
                const item = document.createElement('div');
                item.className = `layer-item ${layer.id === activeLayerId ? 'active' : ''}`;
                item.onclick = () => handleLayerSelection(layer.id);
                item.innerHTML = `
                    <div class="layer-info">
                        <img class="layer-thumbnail" src="${layer.rawImg.src}">
                        <span class="layer-name">${layer.name}</span>
                        <span class="smart-badge">SMART</span>
                    </div>
                `;
                layersContainer.appendChild(item);
            });
        }

        window.onload = () => {
            createLayer("https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1200&q=80", "Arrière-plan dynamique");
        };
    </script>
</body>
</html>
