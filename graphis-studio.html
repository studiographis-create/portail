<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Éditeur RAW Web - Interface Fonctionnelle</title>
<style>
    :root {
        --bg-color: #121212;
        --panel-bg: rgba(25, 25, 25, 0.95);
        --accent-color: #FFD700;
        --text-color: #E0E0E0;
        --border-color: #333;
    }

    body {
        margin: 0;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        overflow: hidden;
    }

    header {
        padding: 12px 20px;
        background: #1a1a1a;
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid var(--border-color);
    }

    button {
        background: transparent;
        color: var(--accent-color);
        border: 1px solid var(--accent-color);
        padding: 6px 12px;
        cursor: pointer;
        border-radius: 4px;
        font-weight: bold;
        transition: all 0.2s;
    }

    button:hover {
        background: var(--accent-color);
        color: var(--bg-color);
    }

    #workspace {
        display: flex;
        justify-content: center;
        align-items: center;
        height: calc(100vh - 50px);
        position: relative;
    }

    #photo {
        max-width: 80%;
        max-height: 80%;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        /* Retrait de la transition pour plus de réactivité sur les gros fichiers */
    }

    /* Panneau latéral des réglages */
    #panel {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 340px;
        max-height: 90vh;
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 10px 25px rgba(0,0,0,0.9);
        backdrop-filter: blur(10px);
        z-index: 10;
    }

    /* Panneau de Calques */
    #layersPanel {
        display: none; /* Masqué par défaut */
        position: absolute;
        top: 20px;
        left: 20px;
        width: 280px;
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.9);
        backdrop-filter: blur(10px);
        z-index: 10;
    }

    .layer-item {
        background: #333;
        padding: 10px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        margin-bottom: 8px;
        cursor: pointer;
        border: 1px solid #444;
    }
    .layer-item.active { border-color: var(--accent-color); }
    .layer-eye { margin-right: 10px; color: var(--accent-color); }

    .panel-header {
        padding: 15px;
        border-bottom: 1px solid var(--border-color);
        cursor: move;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .panel-header h2 { margin: 0; font-size: 14px; color: var(--accent-color); text-transform: uppercase; }

    .panel-content { overflow-y: auto; padding: 10px; flex-grow: 1; }
    .panel-content::-webkit-scrollbar { width: 6px; }
    .panel-content::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

    details { margin-bottom: 5px; border-bottom: 1px solid #2a2a2a; }
    summary {
        padding: 10px 5px; cursor: pointer; font-size: 13px; font-weight: 600;
        display: flex; justify-content: space-between;
    }
    summary::-webkit-details-marker { display: none; }
    summary:after { content: "▼"; font-size: 10px; color: #666; }
    details[open] summary:after { content: "▲"; color: var(--accent-color); }
    details[open] summary { color: var(--accent-color); }

    .module-content { padding: 10px 5px 15px 5px; }
    .control-group { margin-bottom: 12px; }
    .control-group label { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 11px; color: #bbb; }
    .value-display { color: var(--accent-color); font-variant-numeric: tabular-nums; }
    
    input[type=range] {
        width: 100%; accent-color: var(--accent-color); height: 4px;
        background: #333; outline: none; -webkit-appearance: none; border-radius: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none; width: 12px; height: 12px;
        border-radius: 50%; background: var(--accent-color); cursor: pointer;
    }
    
    hr.divider { border-color: #333; margin: 15px 0; border-style: solid; border-width: 1px 0 0 0; }
</style>
</head>
<body>

    <header>
        <div>
            <!-- Champ fichier caché lié au bouton Importer -->
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
            <button id="importBtn">Importer (JPG/PNG)</button>
            <button id="layersBtn" style="margin-left:10px;">Système de Calques</button>
        </div>
        <button id="exportBtn">Exporter</button>
    </header>

    <div id="workspace">
        <img id="photo" src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1200&q=80" alt="Zone de travail" crossorigin="anonymous">
        
        <!-- Panneau des Calques -->
        <div id="layersPanel">
            <h3 style="margin-top:0; color:var(--accent-color); font-size:14px; text-transform:uppercase;">Calques</h3>
            <div id="layersContainer">
                <div class="layer-item active">
                    <span class="layer-eye">👁</span> Image d'arrière-plan
                </div>
            </div>
            <button style="width: 100%; margin-top: 10px; font-size: 11px;">+ Ajouter un calque de réglage</button>
        </div>

        <!-- Panneau des Réglages -->
        <div id="panel">
            <div class="panel-header" id="panelHeader">
                <h2>Caméra Raw</h2>
            </div>

            <div class="panel-content">
                <!-- 1. RÉGLAGES DE BASE -->
                <details open>
                    <summary>Réglages de base</summary>
                    <div class="module-content">
                        <!-- Remarquez les attributs ID ajoutés ici pour le ciblage JS -->
                        <div class="control-group">
                            <label>Température <span class="value-display">0</span></label>
                            <input type="range" id="tempSlider" min="-100" max="100" value="0">
                        </div>
                        <hr class="divider">
                        <div class="control-group">
                            <label>Exposition <span class="value-display">0.0</span></label>
                            <input type="range" id="expSlider" min="-5" max="5" step="0.1" value="0">
                        </div>
                        <div class="control-group">
                            <label>Contraste <span class="value-display">0</span></label>
                            <input type="range" id="contSlider" min="-100" max="100" value="0">
                        </div>
                        <hr class="divider">
                        <div class="control-group">
                            <label>Saturation <span class="value-display">0</span></label>
                            <input type="range" id="satSlider" min="-100" max="100" value="0">
                        </div>
                    </div>
                </details>
                
                <!-- D'autres panneaux visuels peuvent être réintégrés ici -->
                <details>
                    <summary>Courbe & Détails (Structure)</summary>
                    <div class="module-content">
                        <p style="font-size:11px; color:#888;">Utilisez la même logique d'ID JS pour animer les curseurs suivants.</p>
                    </div>
                </details>
            </div>
        </div>
    </div>

    <script>
        // --- VARIABLES GLOBALES ---
        const photo = document.getElementById('photo');
        
        // --- 1. IMPORTATION ---
        const fileInput = document.getElementById('fileInput');
        const importBtn = document.getElementById('importBtn');

        importBtn.addEventListener('click', () => {
            fileInput.click(); // Déclenche le clic sur l'input invisible
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    photo.src = event.target.result;
                    // Réinitialisation des réglages à l'import
                    resetSliders(); 
                };
                reader.readAsDataURL(file);
            }
        });

        // --- 2. EXPORTATION ---
        const exportBtn = document.getElementById('exportBtn');
        exportBtn.addEventListener('click', () => {
            // Création d'un canvas invisible
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // On lui donne la vraie taille de l'image
            canvas.width = photo.naturalWidth;
            canvas.height = photo.naturalHeight;
            
            // On applique les filtres CSS actuels au contexte du canvas
            ctx.filter = photo.style.filter;
            ctx.drawImage(photo, 0, 0, canvas.width, canvas.height);
            
            // Création d'un lien de téléchargement
            const link = document.createElement('a');
            link.download = 'Photo_Retouche_CameraRaw.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.9); // Qualité JPEG 90%
            link.click();
        });

        // --- 3. PANNEAU DE CALQUES (Affichage/Masquage) ---
        const layersBtn = document.getElementById('layersBtn');
        const layersPanel = document.getElementById('layersPanel');
        
        layersBtn.addEventListener('click', () => {
            layersPanel.style.display = (layersPanel.style.display === 'none' || layersPanel.style.display === '') ? 'block' : 'none';
        });

        // --- 4. LOGIQUE DE TRAITEMENT D'IMAGE (Impact des curseurs) ---
        const tempSlider = document.getElementById('tempSlider');
        const expSlider = document.getElementById('expSlider');
        const contSlider = document.getElementById('contSlider');
        const satSlider = document.getElementById('satSlider');

        function applyFilters() {
            // Lecture des valeurs mathématiques
            const tempVal = parseInt(tempSlider.value);
            const expVal = parseFloat(expSlider.value);
            const contVal = parseInt(contSlider.value);
            const satVal = parseInt(satSlider.value);

            // Mise à jour de l'affichage chiffré dans l'UI
            tempSlider.previousElementSibling.querySelector('.value-display').innerText = tempVal;
            expSlider.previousElementSibling.querySelector('.value-display').innerText = expVal.toFixed(1);
            contSlider.previousElementSibling.querySelector('.value-display').innerText = contVal;
            satSlider.previousElementSibling.querySelector('.value-display').innerText = satVal;

            // Conversion des valeurs pour les filtres CSS
            
            // Exposition: de -5 à +5 -> Luminosité de 0% à 200% (100% = normal)
            const brightness = 100 + (expVal * 20); 
            
            // Contraste: de -100 à +100 -> 0% à 200%
            const contrast = 100 + contVal;
            
            // Saturation: de -100 à +100 -> 0% à 200%
            const saturate = 100 + satVal;

            // Chaleur (Température)
            let sepia = 0;
            let hue = 0;
            if (tempVal > 0) {
                // Réchauffer (Jaune/Orange)
                sepia = tempVal; 
            } else if (tempVal < 0) {
                // Refroidir (Bleu) - Approximation via sepia inversé et rotation de teinte
                sepia = Math.abs(tempVal) * 0.4;
                hue = -30; 
            }

            // Construction de la chaîne de filtres et application directe sur la balise <img>
            photo.style.filter = `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturate}%) sepia(${sepia}%) hue-rotate(${hue}deg)`;
        }

        function resetSliders() {
            tempSlider.value = 0;
            expSlider.value = 0;
            contSlider.value = 0;
            satSlider.value = 0;
            applyFilters();
        }

        // Écouteurs d'événements sur les curseurs ("input" s'active pendant le glissement)
        tempSlider.addEventListener('input', applyFilters);
        expSlider.addEventListener('input', applyFilters);
        contSlider.addEventListener('input', applyFilters);
        satSlider.addEventListener('input', applyFilters);

        // --- 5. DRAG & DROP DU PANNEAU (identique à précédemment) ---
        const panel = document.getElementById('panel');
        const panelHeader = document.getElementById('panelHeader');
        let isDragging = false;
        let startX, startY, initialX, initialY;

        panelHeader.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX; startY = e.clientY;
            initialX = panel.offsetLeft; initialY = panel.offsetTop;
            panelHeader.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panel.style.left = `${initialX + (e.clientX - startX)}px`;
            panel.style.top = `${initialY + (e.clientY - startY)}px`;
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            panelHeader.style.cursor = 'move';
        });
    </script>
</body>
</html>
