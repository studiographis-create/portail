<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Éditeur RAW Web - Graphis Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Allura&family=Caveat:wght@400..700&family=Dancing+Script:wght@400..700&family=Great+Vibes&family=Pacifico&family=Pinyon+Script&family=Sacramento&family=Satisfy&display=swap" rel="stylesheet">

<style>
    :root {
        --bg-color: #121212;
        --panel-bg: rgba(25, 25, 25, 0.95);
        --accent-color: #FFD700;
        --text-color: #E0E0E0;
        --border-color: #333;
    }

    * {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    *::selection {
        background: transparent;
        color: inherit;
    }

    body { margin: 0; background-color: var(--bg-color); color: var(--text-color); font-family: -apple-system, sans-serif; overflow: hidden; }

    header { padding: 12px 20px; background: #1a1a1a; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
    
    .brand-logo {
        font-weight: 800;
        font-size: 16px;
        letter-spacing: 1.5px;
        color: var(--accent-color);
        text-transform: uppercase;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .brand-logo span { color: #fff; font-weight: 300; }

    .header-center { display: flex; align-items: center; }

    button { background: transparent; color: var(--accent-color); border: 1px solid var(--accent-color); padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; transition: all 0.2s; }
    button:hover { background: var(--accent-color); color: var(--bg-color); }

    #workspace { display: flex; flex-direction: column; justify-content: center; align-items: center; height: calc(100vh - 57px); position: relative; overflow: hidden; }
    
    #zoom-toolbar {
        position: absolute;
        top: 15px;
        background: rgba(20, 20, 20, 0.85);
        border: 1px solid var(--border-color);
        padding: 6px 12px;
        border-radius: 6px;
        display: flex;
        gap: 8px;
        z-index: 8;
        backdrop-filter: blur(5px);
    }
    #zoom-toolbar button { padding: 4px 10px; font-size: 12px; }

    #image-container { 
        position: relative; 
        width: 100%; 
        height: 100%; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        overflow: hidden;
        perspective: 1000px;
        background-color: var(--bg-color);
    }
    
    .canvas-layer { 
        position: absolute;
        display: block; 
        max-width: 80%; 
        max-height: 80%; 
        object-fit: contain; 
        cursor: grab;
        transform-origin: center center; 
        background: transparent !important;
    }
    .canvas-layer:active { cursor: grabbing; }

    body.tool-brush .canvas-layer,
    body.tool-brush #image-container {
        cursor: none !important;
    }

    body.tool-tat .canvas-layer,
    body.tool-tat #image-container {
        cursor: crosshair !important;
    }

    #brush-cursor {
        position: absolute;
        pointer-events: none;
        display: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        border-radius: 50%;
    }
    .brush-outer-circle {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 50%;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.8), inset 0 0 2px rgba(0, 0, 0, 0.8);
    }
    .brush-inner-circle {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        border: 1px dashed rgba(255, 215, 0, 0.9);
        border-radius: 50%;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.6);
    }

    #transform-bounding-box {
        position: absolute;
        display: none;
        border: 1px dashed var(--accent-color);
        background: transparent !important;
        pointer-events: none;
        z-index: 1000;
        box-sizing: border-box;
    }
    
    #vignette-overlay { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 999; transition: none; }

    #layersPanel {
        display: none;
        position: absolute;
        top: 70px;
        left: 20px;
        width: 350px;
        max-height: 80vh;
        overflow-y: auto;
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.9);
        backdrop-filter: blur(10px);
        z-index: 12;
    }

    .layer-item {
        background: #222;
        padding: 6px 10px;
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
        cursor: pointer;
        border: 1px solid #444;
        font-size: 12px;
        gap: 8px;
        transition: background 0.15s, border-color 0.15s;
    }
    .layer-item.active { border-color: var(--accent-color); background: #2a2a2a; }
    
    .layer-info { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
    .layer-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
    
    .smart-badge {
        font-size: 9px;
        color: var(--accent-color);
        border: 1px solid var(--accent-color);
        border-radius: 2px;
        padding: 1px 3px;
        margin-left: 2px;
        flex-shrink: 0;
        font-weight: bold;
    }

    .layer-thumbnail {
        width: 28px;
        height: 28px;
        object-fit: cover;
        border-radius: 3px;
        border: 1px solid #555;
        background-color: #1a1a1a;
        flex-shrink: 0;
    }

    .tool-select-box {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        margin-bottom: 12px;
        background: #1a1a1a;
        padding: 4px;
        border-radius: 4px;
        border: 1px solid #333;
    }
    .tool-btn {
        background: transparent;
        color: #aaa;
        border: none;
        padding: 6px 2px;
        font-size: 10px;
        border-radius: 3px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
    }
    .tool-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tool-btn.active { background: var(--accent-color); color: #121212; font-weight: bold; }
    .tool-btn.active svg { stroke: #121212; }

    #panel { position: absolute; top: 20px; right: 20px; width: 340px; max-height: 90vh; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 10; }
    .panel-header { padding: 15px; border-bottom: 1px solid var(--border-color); cursor: move; display: flex; justify-content: space-between; align-items: center; }
    .panel-header h2 { margin: 0; font-size: 14px; color: var(--accent-color); text-transform: uppercase; letter-spacing: 1px; }

    .panel-content { overflow-y: auto; padding: 10px; flex-grow: 1; }
    .panel-content::-webkit-scrollbar { width: 6px; }
    .panel-content::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

    details { margin-bottom: 5px; border-bottom: 1px solid #2a2a2a; }
    summary { padding: 10px 5px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-color); display: flex; justify-content: space-between; align-items: center; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    summary:after { content: "▼"; font-size: 10px; color: #666; margin-left: 8px; }
    details[open] summary:after { content: "▲"; color: var(--accent-color); }
    details[open] summary { color: var(--accent-color); }

    .control-group { margin-bottom: 12px; }
    .control-group label { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 11px; color: #bbb; align-items: center; }
    .value-display { color: var(--accent-color); font-variant-numeric: tabular-nums; }

    input[type=range] { width: 100%; accent-color: var(--accent-color); height: 4px; background: #333; outline: none; -webkit-appearance: none; border-radius: 2px; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent-color); cursor: pointer; }
    select, input[type=text] { width: 100%; background: #222; color: #fff; border: 1px solid #444; padding: 4px; border-radius: 4px; font-size: 11px; box-sizing: border-box; }
    
    .number-input {
        width: 50px !important;
        text-align: right;
        padding: 2px 4px !important;
        font-size: 11px !important;
        background: #1e1e1e !important;
        border: 1px solid #444 !important;
        border-radius: 3px !important;
        color: var(--accent-color) !important;
    }
    .transform-input-wrapper { display: flex; align-items: center; gap: 6px; }
    .reset-btn { background: transparent; border: none; color: #888; cursor: pointer; padding: 2px 4px; border-radius: 3px; display: flex; align-items: center; justify-content: center; }
    .reset-btn:hover { color: var(--accent-color); }
    .reset-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* GRILLE D'EFFETS */
    .effects-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 5px; }
    .effect-card { background: #1a1a1a; border: 1px solid #333; border-radius: 6px; overflow: hidden; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; }
    .effect-card:hover { border-color: var(--accent-color); transform: translateY(-2px); }
    .effect-card.active { border-color: var(--accent-color); box-shadow: 0 0 8px rgba(255, 215, 0, 0.4); }
    .effect-preview-box { width: 100%; height: 60px; }
    .effect-card-title { font-size: 10px; font-weight: 600; padding: 5px; text-align: center; color: #ccc; width: 100%; background: #141414; box-sizing: border-box; }
    .effect-card.active .effect-card-title { color: var(--accent-color); font-weight: bold; }

    .color-circles-bar { display: flex; justify-content: space-between; align-items: center; background: #181818; padding: 8px 10px; border-radius: 6px; border: 1px solid #333; margin-bottom: 12px; }
    .color-circle-btn { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
    .color-circle-btn.active { transform: scale(1.25); border-color: #ffffff; }
</style>
</head>
<body>

    <header>
        <div class="brand-logo">Graphis<span>Studio</span></div>

        <div class="header-center">
            <!-- Entrées de fichiers cachées -->
            <input type="file" id="fileInput" accept="image/*, .cr2, .cr3, .nef, .arw, .dng, .raw, .orf, .rw2" style="display: none;">
            <input type="file" id="layerFileInput" accept="image/*, .cr2, .cr3, .nef, .arw, .dng, .raw, .orf, .rw2" style="display: none;">
            
            <button id="importBtn">Importer</button>
            <button id="layersBtn" style="margin-left: 10px;">Système de Calques</button>
        </div>
        <button id="exportBtn">Exporter</button>
    </header>

    <div id="workspace">
        <div id="layersPanel">
            <h3 style="margin-top:0; color:var(--accent-color); font-size:13px; text-transform:uppercase; border-bottom:1px solid #333; padding-bottom:8px;">Calques (Objets Dynamiques)</h3>
            
            <div id="layersContainer"></div>
            <button id="addLayerBtn" style="width: 100%; margin-top: 10px; font-size: 11px;">+ Nouveau Calque Image</button>
        </div>

        <div id="image-container">
            <div id="transform-bounding-box"></div>
            <div id="vignette-overlay"></div>
        </div>
        
        <div id="panel">
            <div class="panel-header" id="panelHeader"><h2>Développement</h2></div>
            <div class="panel-content" id="controls">
                
                <!-- REGLAGES DE BASE -->
                <details open>
                    <summary>Réglages de base</summary>
                    <div class="module-content">
                        <div class="control-group">
                            <label>Exposition <input type="number" id="num_t_exp" class="number-input" value="0.0" min="-5" max="5" step="0.1"></label>
                            <input type="range" id="t_exp" min="-5" max="5" step="0.1" value="0">
                        </div>
                        <div class="control-group">
                            <label>Contraste <input type="number" id="num_t_cont" class="number-input" value="0" min="-100" max="100"></label>
                            <input type="range" id="t_cont" min="-100" max="100" value="0">
                        </div>
                    </div>
                </details>

                <!-- PANNEAU EFFETS -->
                <details>
                    <summary>Effets</summary>
                    <div class="module-content">
                        <div class="effects-grid" id="effectsGrid"></div>
                    </div>
                </details>
            </div>
        </div>
    </div>

    <script>
        const imageContainer = document.getElementById('image-container');
        const layersContainer = document.getElementById('layersContainer');
        const layersPanel = document.getElementById('layersPanel');
        const fileInput = document.getElementById('fileInput');
        const layerFileInput = document.getElementById('layerFileInput');
        
        const importBtn = document.getElementById('importBtn');
        const layersBtn = document.getElementById('layersBtn');
        const addLayerBtn = document.getElementById('addLayerBtn');

        let layers = [];
        let activeLayerId = null;

        const DEFAULT_RAW_SETTINGS = {
            t_exp: 0, t_cont: 0, activeEffect: 'none'
        };

        // GESTION DU BOUTON IMPORTER
        importBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    createLayer(event.target.result, file.name);
                };
                reader.readAsDataURL(file);
            }
        });

        // GESTION DU BOUTON SYSTÈME DE CALQUES
        layersBtn.addEventListener('click', () => {
            const isVisible = layersPanel.style.display === 'block';
            layersPanel.style.display = isVisible ? 'none' : 'block';
        });

        // GESTION DU BOUTON NOUVEAU CALQUE
        addLayerBtn.addEventListener('click', () => {
            layerFileInput.click();
        });

        layerFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    createLayer(event.target.result, file.name);
                };
                reader.readAsDataURL(file);
            }
        });

        function createLayer(imgSrc, name = "Calque") {
            const id = 'layer_' + Date.now();
            const canvasLayer = document.createElement('canvas');
            canvasLayer.className = 'canvas-layer';
            
            const rawImg = new Image();
            rawImg.crossOrigin = 'anonymous';

            const layerObj = {
                id, name, img: canvasLayer, rawImg: rawImg,
                x: 0, y: 0, scale: 1, rotation: 0, opacity: 100, visible: true,
                rawSettings: JSON.parse(JSON.stringify(DEFAULT_RAW_SETTINGS))
            };

            rawImg.onload = () => {
                canvasLayer.width = rawImg.naturalWidth || 800;
                canvasLayer.height = rawImg.naturalHeight || 600;
                renderLayer(layerObj);
                updateLayersUI();
            };
            rawImg.src = imgSrc;

            canvasLayer.addEventListener('mousedown', () => setActiveLayer(id));
            imageContainer.appendChild(canvasLayer);
            layers.push(layerObj);
            setActiveLayer(id);
        }

        function setActiveLayer(id) {
            activeLayerId = id;
            updateLayersUI();
        }

        function renderLayer(layer) {
            const ctx = layer.img.getContext('2d');
            ctx.clearRect(0, 0, layer.img.width, layer.img.height);
            ctx.drawImage(layer.rawImg, 0, 0, layer.img.width, layer.img.height);
        }

        function updateLayersUI() {
            layersContainer.innerHTML = '';
            layers.slice().reverse().forEach((layer) => {
                const item = document.createElement('div');
                item.className = `layer-item ${layer.id === activeLayerId ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="layer-info">
                        <img class="layer-thumbnail" src="${layer.rawImg.src}" alt="Vignette">
                        <span class="layer-name">${layer.name}</span>
                        <span class="smart-badge">SMART</span>
                    </div>
                `;
                item.onclick = () => setActiveLayer(layer.id);
                layersContainer.appendChild(item);
            });
        }

        window.onload = () => {
            createLayer("https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1200&q=80", "Arrière-plan principal");
        };
    </script>
</body>
</html>
